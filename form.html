<body>
    <header>
        <nav>
            <a href="index.html"><img src="img/logo.png" alt="logo" type="image/png" class="logo" height="60" width="36"></a>
            <ul>
                <li><a href="galery.html" class="nav__item">TRABAJOS</a></li>
                <li class="nav__item">|</li>
                <li><a href="form.html" class="nav__item">CONTACTO</a></li>
            </ul>
        </nav>
    </header>
    <main class="form-main">
        <form method="post" action="mailto:jorgito@gmail.com" target="_blank" enctype="text/plain">
            <p>
                Te invito a que trabajemos juntos en tu siguiente proyecto.<br>
                Pero primero complete el siguiente formulario.
            </p>
            <label for="name">Nombre y Apellido</label>
            <input class="input" type="text" name="name" id="name" minlength="3" placeholder="Gerardo Caminos">
            <label for="email">E-Mail</label>
            <input class="input" type="email" name="email" id="email" placeholder="Ger2004@gmail.com">
            <label for="email">Telefono</label>
            <input class="input" type="tel" name="tel" id="tel" placeholder="+54 123 1234-1234">
            <label for="service">Servicio</label>
            <select class="input" name="service" id="service">
                <option value="">Diseño de Identidad Completa</option>
                <option value="">Diseño Editorial</option>
                <option value="">Diseño de Señaletica</option>
                <option value="">Diseño Web</option>
                <option value="">Diseño de Packaging</option>
                <option value="">Diseño de Tipografia(Display)</option>
                <option value="">Otro</option>
            </select>
            <label for="mensaje">Mensaje</label>
            <textarea class="input" name="mensaje" id="mensaje" placeholder="..."></textarea>
            <input class="input" type="submit" value="Enviar" required>
        </form>
    </main>
    <footer>
        <ul>

        </ul>
        <h4>©2026 Hecho en Argentina</h4>
    </footer>
